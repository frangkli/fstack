# Optional: runs readiness's template samples when the templates or samples change.
name: Templates

on:
  pull_request:
    paths:
      - .github/workflows/templates.yml
      - justfile
      - skills/readiness/templates/**
      - tests/readiness-templates/**
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the tools the checks run; the Rust check fetches cargo-insta, cargo-deny and nextest
      # through `mise x`, and rustup installs the template's pinned toolchain.
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          mise_toml: |
            [tools]
            just = "1.59.0"
            node = "26.13.0"
            pnpm = "12.16.1"
      - run: just templates
