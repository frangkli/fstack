# ]

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"
hooks = [{ id = "betterleaks" }]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos" }]

# The language templates add their formatter and lint hooks below, as `language = "system"` hooks
# that call the repo's own commands.
