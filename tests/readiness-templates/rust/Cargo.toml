# A sample workspace that the readiness Rust templates must pass. `check.sh` copies it to a
# scratch folder, appends the template's `Cargo.toml` lints and insta profile, and adds the
# template's clippy, deny, rustfmt, toolchain and nextest files.
[workspace]
members = ["crates/header"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
insta = "1.49.0"
proptest = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"
